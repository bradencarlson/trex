<div id="installation" class="installation">
  <h2>Installation</h2>

  <p>Currently, the only supported installation method
  is through Cargo. Take the following steps.</p>
  <code class="bash">git clone https://github.com/bradencarlson/trex.git<br>
  cd trex<br>
  cargo build --release</code>
  </p>After creating the binary, simply place it somewhere in the system
  path.</p>

</div>
